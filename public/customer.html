<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Website</title>
    <link rel="stylesheet" href="customer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
   

     <!-- Headers     -->
    <header>
        <nav>
            <div class="logo">
                <h1>ABC</h1>
            </div>
            <div class="nav-items">
                <a href="#">Products</a>
                <div class="icon-count" id="icon-count">
                    <i class="fa-solid fa-bag-shopping"   onclick="openCart()"></i>
                    <span id="cart-count" onclick="cartCount()">0</span>
                </div>
                <div id="search-filter">
                    <input type="text" id="search-bar" placeholder="Search products..."/>
                    <i class="fa-solid fa-magnifying-glass" id="filter-button" onclick="searchFilter()"></i>
                  </div>
                  
                <button onclick="logOut()">Log Out</button>
            </div>
        </nav>
    </header>


    <!-- Cart -->
    <div class="cart" id="cart-section" >
        <h2 class="cart-title">Your Cart</h2>

        <!-- CONTENT  -->
        <div class="cart-content" id="cart-content">


        </div>

        <!-- TOTAL   -->
        <div class="total">
            <div class="total-title">Total</div>
            <div class="total-price" id="total-amount" onclick="updateTotalPrice()">$0.00</div>
        </div>
        <div class="buttons">
             <!-- BUY BUTTON  -->
             <button type="button" class="btn-buy" id="buyNow" onclick="customerInfo()">Buy Now</button>
             <!-- CART CLOSE  -->
             <button id="cart-close" onclick="closeCart()">Close Cart</button>

         </div>
    </div>


    <!-- product Section -->
    <div class="body">

        <h2 class="section-title">Shop Products</h2>
        <div class="cards">
            <div class="product-cards">
                <ul id="product-list">
                    
                    
                </ul>
            </div> 
        </div>
        
    </div>


    <!-- buy now form -->
      <div class="form" id="form">
            <label>Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
            <label>Phone no:</label>
            <input type="text" id="number" placeholder="Enter your mobile number">
            <label>Delivery Address:</label>
            <textarea id="address" name="address" required></textarea>
            <button type="submit" onclick="placeOrder()" >Place Order</button>
          
      </div>



      
      <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
      <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
      <script src="app.js"></script>

</body>
</html>
